<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no" />
  <title>Promiseon Korean Menu (FAST)</title>
  <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="assets/favicon/favicon.ico" type="image/x-icon" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- CSS: Bootstrap only (keep UI familiar, reduce JS plugins) -->
  <link rel="stylesheet" href="assets/vendor/bootstrap/dist/css/bootstrap.min.css" />
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Google Fonts (optional; comment out if you want the fastest possible FCP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #F9FAFB;
      --card: #fff;
      --border: #E5E7EB;
      --text: #111827;
      --muted: #6B7280;
      --primary: #2563EB;
      --danger: #DC2626;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04);
      --radius: 14px;
    }

    body {
      font-family: "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header-sticky {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tabs .tab-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      line-height: 1;
    }

    .tabs .tab-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: #EFF6FF;
      font-weight: 700;
    }

    .meal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .meal-card__header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
    }

    .meal-card__workplace {
      font-size: 16px;
      font-weight: 800;
    }

    .meal-card__meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .meal-chip {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: #F9FAFB;
    }

    .meal-card__section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .meal-card__primary {
      font-size: 15px;
      font-weight: 800;
      color: var(--danger);
      border-left: 4px solid var(--danger);
      padding-left: 10px;
    }

    .meal-item {
      font-size: 14px;
      line-height: 1.7;
    }

    .meal-list {
      margin: 0;
      padding-left: 18px;
    }

    .skeleton {
      background: linear-gradient(90deg, #f2f2f2 25%, #eaeaea 37%, #f2f2f2 63%);
      background-size: 400% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
      border-radius: 10px;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    .sk-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: #fff;
      overflow: hidden;
    }

    .sk-h {
      height: 84px;
      border-bottom: 1px solid var(--border);
    }

    .sk-b {
      padding: 14px;
    }

    .sk-line {
      height: 12px;
      margin: 10px 0;
    }

    .sk-line.sm {
      width: 55%;
    }

    .sk-line.md {
      width: 75%;
    }

    .sk-line.lg {
      width: 95%;
    }

    /* 1) 기본: 왼쪽부터 붙여 배치 */
    .toolbar {
      justify-content: flex-start;
      /* space-between 제거 효과 */
    }

    /* 2) 상태 영역은 오른쪽 끝으로 밀기 */
    .toolbar>.d-flex.gap-2.align-items-center:last-child {
      margin-left: auto;
    }

    /* 3) 큰 화면(PC): 탭을 검색 옆에 붙이고 한 줄 유지 */
    @media (min-width: 992px) {
      .toolbar {
        flex-wrap: nowrap;
      }

      .tabs {
        margin-left: 12px;
      }
    }

    /* 4) 작은 화면(모바일/태블릿): 탭을 아래줄로 내리기 */
    @media (max-width: 991.98px) {
      .tabs {
        width: 100%;
        margin-top: 10px;
        order: 3;
        /* 아래로 */
      }
    }

    @media (max-width: 576px) {
      .navbar.m-2 {
        margin: 0 !important;
      }

      .toolbar {
        padding-left: 8px;
        padding-right: 8px;
      }
    }

    #btn_lang_kr.active,
    #btn_lang_vn.active {
      border-color: var(--primary);
      background: #EFF6FF;
    }
  </style>

<body>

    <header class="navbar navbar-expand-lg navbar-bordered bg-white m-2">
      <div class="container-fluid">
        <img id="main_logo" class="mb-1" src="assets/svg/logos/main_logo_kr.png" alt="Logo" style="height: 100px;">
      </div>
    </header>

    <!-- toast container (bootstrap) -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;"></div>

    <main class="main">
      <div class="">
        <div class="toolbar">
          <!-- Date (native input=date: fastest) -->
          <div class="d-flex gap-2 align-items-center" style="min-width: 280px;">
            <div class="input-group">

      <!-- Card template (DOM clone: fast) -->

          <div class="card meal-card h-100 shadow-sm">

      <!-- Skeleton template -->

  <!-- JS: keep minimal (Bootstrap bundle + moment + fslightbox) -->
  <script src="assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/moment/min/moment.min.js"></script>
  <script src="assets/vendor/moment/min/locale/ko.min.js"></script>
  <script src="assets/vendor/fslightbox/index.js"></script>

  <script>
    // ------------------------------------------------------------
    // FAST Architecture Notes:
    // - No bootstrap-table: card-only rendering
    // - DOM cloning via <template> + DocumentFragment
    // - Cache: memory Map with TTL + SWR (show cache instantly, refresh in bg)
    // - AbortController cancels in-flight requests on rapid interactions
    // ------------------------------------------------------------

    const API_BASE = 'https://pvbi.ddns.net/api/korean-menu';
    const API_KEY = 'l0vLjDuIxAAUjHd7';

    const formState = {
      lang: 'kr',
      searchDate: '',
      searchSite: '0',
      searchCategory: '0'
    };

    const I18N = {
      kr: {
        TITLE_MAIN: '메인 메뉴',
        TITLE_MENU: '메뉴',
        ALL: '전체',
        BREAKFAST: '조식',
        LUNCH: '중식',
        DINNER: '석식',
        NIGHT: '야식',
        EMPTY_TITLE: '조회 결과 없음',
        EMPTY_DESC: '선택한 조건에 해당하는 식단이 없습니다.',
        NO_MENU: '등록된 메뉴가 없습니다.',
        FOOTER_NOTICE: '식자재 수급 상황에 따라서 메뉴는 바뀔 수 있습니다.'
      },
      vn: {
        TITLE_MAIN: 'Món chính',
        TITLE_MENU: 'Thực đơn',
        ALL: 'Tất cả',
        BREAKFAST: 'sáng',
        LUNCH: 'trưa',
        DINNER: 'tối',
        NIGHT: 'đêm',
        EMPTY_TITLE: 'Không có dữ liệu',
        EMPTY_DESC: 'Không có thực đơn cho điều kiện đã chọn.',
        NO_MENU: 'Không có món ăn',
        FOOTER_NOTICE: 'Thực đơn có thể thay đổi tùy theo tình hình cung ứng nguyên liệu.'
      }
    };

    function getQueryParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }

    function setStatus(text) {
      const el = document.getElementById('status_text');
      if (el) el.textContent = text || '';
    }

    // ---- Toast (Bootstrap) ----
    function toast(message) {
      const container = document.querySelector('.toast-container');
      if (!container) return;

      const toastEl = document.createElement('div');
      toastEl.className = 'toast border border-primary';
      toastEl.role = 'alert';
      toastEl.ariaLive = 'assertive';
      toastEl.ariaAtomic = 'true';
      toastEl.setAttribute('data-bs-delay', '2500');

      toastEl.innerHTML = `
        <div class="toast-header">
          <strong class="me-auto text-black">Message</strong>
          <small>Just now</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body"><p class="text-black mb-0"></p></div>
      `;

      toastEl.querySelector('.toast-body p').textContent = message;
      container.appendChild(toastEl);

      const t = new bootstrap.Toast(toastEl);
      t.show();

      setTimeout(() => toastEl.remove(), 3500);
    }

    // ---- Cache (TTL + SWR) ----
    const menuCache = new Map(); // key -> {ts, data}
    const CACHE_TTL_MS = 2 * 60 * 1000; // 2 min (adjust as needed)

    function cacheKey(date, site, category, lang) {
      return `${date}|${site}|${category}|${lang}`;
    }

    function cacheGet(key) {
      const v = menuCache.get(key);
      if (!v) return null;
      if ((Date.now() - v.ts) > CACHE_TTL_MS) return null;
      return v.data;
    }

    function cacheSet(key, data) {
      menuCache.set(key, { ts: Date.now(), data });
    }

    // ---- Request control (abort + dedupe) ----
    let currentAbort = null;
    const inflight = new Map(); // key -> Promise

    async function fetchMenu({ date, site, category, lang }, { signal } = {}) {
      const url = new URL(API_BASE);
      url.searchParams.set('date', date);
      url.searchParams.set('siteId', site);
      url.searchParams.set('categoryId', category);

      const key = cacheKey(date, site, category, lang);
      if (inflight.has(key)) return inflight.get(key);

      const p = (async () => {
        const res = await fetch(url.toString(), {
          method: 'GET',
          headers: { 'X-API-KEY': API_KEY },
          signal
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const json = await res.json();
        return json;
      })();

      inflight.set(key, p);

      try {
        const data = await p;
        return data;
      } finally {
        inflight.delete(key);
      }
    }

    // ---- Rendering (template clone + fragment) ----
    function showEmptyState(show) {
      document.getElementById('menu-empty-state').style.display = show ? '' : 'none';
      document.getElementById('menu-card-container').style.display = show ? 'none' : '';
    }

    function renderSkeleton(count = 10) {
      const container = document.getElementById('menu-card-container');
      const tpl = document.getElementById('skeletonTemplate');
      const frag = document.createDocumentFragment();
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        frag.appendChild(tpl.content.cloneNode(true));
      }
      container.appendChild(frag);
    }

    function normalizeRows(res) {
      if (Array.isArray(res)) return res;
      if (res && Array.isArray(res.rows)) return res.rows;
      if (res && Array.isArray(res.data)) return res.data;
      return [];
    }

    function formatDisplayDate(applyDate) {
      const m = moment(applyDate, 'YYYY-MM-DD');
      const dow = (formState.lang === 'kr') ? m.locale('ko').format('ddd') : m.locale('vi').format('ddd');
      return m.format('MM/DD') + ' (' + dow + ')';
    }

    function menuValue(row, idx) {
      const isVn = formState.lang === 'vn';
      const k = isVn ? `menu_name_v_${idx}` : `menu_name_k_${idx}`;
      return (row && row[k]) ? String(row[k]).trim() : '';
    }

    function categoryLabel(row) {
      return (formState.lang === 'vn') ? (row.category_name_v || '') : (row.category_name_k || '');
    }

    function renderCards(rows) {
      const container = document.getElementById('menu-card-container');
      const tpl = document.getElementById('cardTemplate');

      container.innerHTML = '';
      const frag = document.createDocumentFragment();

      for (const row of rows) {
        const node = tpl.content.cloneNode(true);

        node.querySelector('.js-workplace').textContent = row.workplace_name || '';
        node.querySelector('.js-applydate').textContent = formatDisplayDate(row.apply_date);
        node.querySelector('.js-category').textContent = categoryLabel(row);
        node.querySelector('.js-title-main').textContent = I18N[formState.lang].TITLE_MAIN;
        node.querySelector('.js-title-menu').textContent = I18N[formState.lang].TITLE_MENU;

        const main = menuValue(row, 3);
        node.querySelector('.js-main-menu').textContent = main || '';

        const list = node.querySelector('.js-menu-list');
        const menus = [1, 2, 4, 5, 6, 7].map(i => menuValue(row, i)).filter(v => v);

        if (menus.length === 0) {
          const li = document.createElement('li');
          li.className = 'meal-item text-muted';
          li.textContent = I18N[formState.lang].NO_MENU;
          list.appendChild(li);
        } else {
          for (const m of menus) {
            const li = document.createElement('li');
            li.className = 'meal-item';
            li.textContent = m;
            list.appendChild(li);
          }
        }

        // weekly download button payload
        const btn = node.querySelector('.js-week-download');
        btn.dataset.site = row.site_url || '';
        btn.dataset.date = row.apply_date || '';

        frag.appendChild(node);
      }

      container.appendChild(frag);
    }

    // ---- UI State ----
    function applyI18N() {
      document.getElementById('tab_all').textContent = I18N[formState.lang].ALL;
      document.getElementById('tab_sang').textContent = I18N[formState.lang].BREAKFAST;
      document.getElementById('tab_trua').textContent = I18N[formState.lang].LUNCH;
      document.getElementById('tab_chieu').textContent = I18N[formState.lang].DINNER;
      document.getElementById('tab_dem').textContent = I18N[formState.lang].NIGHT;
      document.getElementById('empty_title').textContent = I18N[formState.lang].EMPTY_TITLE;
      document.getElementById('empty_desc').textContent = I18N[formState.lang].EMPTY_DESC;
      document.getElementById('footer_notice').textContent = I18N[formState.lang].FOOTER_NOTICE;

      updateLogo();
    }

    function setActiveCategoryButton(categoryValue) {
      const buttons = document.querySelectorAll('.js-category');
      buttons.forEach(b => b.classList.toggle('active', String(b.dataset.category) === String(categoryValue)));
    }

    // ---- Category auto-select (kept) ----
    let manualCategoryOverride = false;
    let lastAutoSelectDate = moment().format('YYYY-MM-DD');

    function getCategoryByNow(now = moment()) {
      const h = now.hour();
      if (h >= 5 && h <= 9) return '2';
      if (h >= 10 && h <= 14) return '3';
      if (h >= 15 && h <= 19) return '4';
      return '5';
    }

    function autoSelectCategoryByTime() {
      const today = moment().format('YYYY-MM-DD');
      if (lastAutoSelectDate !== today) {
        manualCategoryOverride = false;
        lastAutoSelectDate = today;
      }
      if (manualCategoryOverride) return;
      const cat = getCategoryByNow();
      formState.searchCategory = cat;
      setActiveCategoryButton(cat);
    }

    // ---- Reload (SWR: cache-first, then revalidate) ----
    async function reload({ revalidate = true } = {}) {
      const date = document.getElementById('start_date').value || moment().format('YYYY-MM-DD');
      const site = formState.searchSite;
      const category = formState.searchCategory;
      const lang = formState.lang;

      const key = cacheKey(date, site, category, lang);

      // 1) show cache immediately (if available)
      const cached = cacheGet(key);
      if (cached) {
        const rows = normalizeRows(cached);
        if (rows.length === 0) {
          showEmptyState(true);
        } else {
          showEmptyState(false);
          renderCards(rows);
        }
        //setStatus('C');
        //setStatus('캐시 표시 중');
        // optionally revalidate in background
        if (!revalidate) return;
      } else {
        showEmptyState(false);
        renderSkeleton(10);
        //setStatus('S');
        //setStatus('조회 중...');
      }

      // 2) cancel previous request
      if (currentAbort) currentAbort.abort();
      currentAbort = new AbortController();

      try {
        const res = await fetchMenu({ date, site, category, lang }, { signal: currentAbort.signal });
        cacheSet(key, res);

        const rows = normalizeRows(res);
        if (rows.length === 0) {
          showEmptyState(true);
        } else {
          showEmptyState(false);
          // Defer heavy DOM work to keep UI responsive on low-end devices
          const doRender = () => renderCards(rows);
          if ('requestIdleCallback' in window) requestIdleCallback(doRender, { timeout: 300 });
          else setTimeout(doRender, 0);
        }
        setStatus('');
      } catch (e) {
        if (e && e.name === 'AbortError') return; // expected on rapid UI changes
        showEmptyState(true);
        setStatus('');
        toast('데이터 조회에 실패했습니다. 네트워크 상태를 확인해주세요.');
        // console.error(e);
      }
    }

    // ---- Weekly download (kept) ----
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('.js-week-download');
      if (!btn) return;

      const site = btn.dataset.site;
      const date = btn.dataset.date;

      if (!site || !date) {
        toast('사업장 또는 날짜 정보가 없습니다.');
        return;
      }

      const m = moment(date, 'YYYY-MM-DD');
      const year = m.isoWeekYear();
      const week = String(m.isoWeek()).padStart(2, '');

      const checkUrl = `https://pvbi.ddns.net/api/korean_menu/weekly-menu/exists/${year}/${site}/${week}?t=${Date.now()}`;

      fetch(checkUrl)
        .then(r => r.json())
        .then(res => {
          if (!res || res.success !== true) {
            toast((res && res.message) || '등록된 주간 식단이 없습니다.');
            return;
          }
          const img = `https://pvbi.ddns.net/api/korean_menu/weekly-menu/${year}/${site}/${week}?t=${Date.now()}`;
          document.getElementById('weeklyPreview').setAttribute('href', img);
          refreshFsLightbox();
          document.getElementById('weeklyPreview').click();
        })
        .catch(() => toast('주간 식단 정보를 불러오지 못했습니다.'));
    });

    // ---- Event wiring ----
    function addDaysToInputDate(deltaDays) {
      const input = document.getElementById('start_date');
      const current = input.value ? moment(input.value, 'YYYY-MM-DD') : moment();
      input.value = current.add(deltaDays, 'days').format('YYYY-MM-DD');
    }

    document.getElementById('bt_date_subtract').addEventListener('click', () => { addDaysToInputDate(-1); reload(); });
    document.getElementById('bt_date_add').addEventListener('click', () => { addDaysToInputDate(1); reload(); });
    document.getElementById('bt_search').addEventListener('click', () => reload({ revalidate: true }));
    document.getElementById('start_date').addEventListener('change', () => reload({ revalidate: true }));

    document.querySelectorAll('.js-category').forEach(btn => {
      btn.addEventListener('click', () => {
        manualCategoryOverride = true;
        formState.searchCategory = String(btn.dataset.category);
        setActiveCategoryButton(formState.searchCategory);
        reload();
      });
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });
    });

    // ---- Init ----
    (function init() {
      const urlLang = getQueryParam('lang');
      if (urlLang === 'kr' || urlLang === 'vn') formState.lang = urlLang;

      const siteParam = getQueryParam('site');
      if (siteParam) formState.searchSite = String(siteParam);

      const dateParam = getQueryParam('date');
      const input = document.getElementById('start_date');
      input.value = dateParam ? String(dateParam) : moment().format('YYYY-MM-DD');

      applyI18N();

      autoSelectCategoryByTime();
      setActiveCategoryButton(formState.searchCategory);

      // periodic auto-select (same logic as original; low overhead)
      setInterval(() => { autoSelectCategoryByTime(); setActiveCategoryButton(formState.searchCategory); }, 5 * 60 * 1000);

      // initial load
      reload({ revalidate: true });
    })();


    function updateLogo() {
      const logo = document.getElementById('main_logo');
      if (!logo) return;

      logo.src = (formState.lang === 'vn')
        ? 'assets/svg/logos/main_logo_vn.png'
        : 'assets/svg/logos/main_logo_kr.png';
    }

    document.getElementById('btn_lang_kr').addEventListener('click', () => {
      formState.lang = 'kr';
      applyI18N();
      reload({ revalidate: true });
    });

    document.getElementById('btn_lang_vn').addEventListener('click', () => {
      formState.lang = 'vn';
      applyI18N();
      reload({ revalidate: true });
    });

  </script>

</body>

</html>
