<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no" />
  <title>Promiseon Vina Korean Menu</title>

  <!-- Favicon -->
  <link rel="shortcut icon" href="assets/favicon/favicon.png" type="image/x-icon" />
  <!--<link rel="icon" href="assets/favicon/favicon.ico" type="image/x-icon" />-->
  <link rel="icon" type="image/png" href="assets/favicon/favicon.png">

  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- CSS: Bootstrap + Icons -->
  <link rel="stylesheet" href="assets/vendor/bootstrap/dist/css/bootstrap.min.css" />
  <link href="assets/vendor/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Google Fonts (optional; comment out if you want the fastest possible FCP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet" />

  <style>
    /* ===== Design Tokens ===== */
    :root {
      --bg: #F9FAFB;
      --card: #fff;
      --border: #E5E7EB;
      --text: #111827;
      --muted: #6B7280;
      --primary: #2563EB;
      --danger: #DC2626;
      --shadow: 0 1px 2px rgba(0, 0, 0, .04);
      --radius: 14px;
    }

    /* ===== Base ===== */
    body {
      font-family: "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== Sticky Header & Toolbar ===== */
    .header-sticky {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      flex-wrap: wrap;
    }

    /* ===== Category Tabs ===== */
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tabs .tab-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      line-height: 1;
    }

    .tabs .tab-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: #EFF6FF;
      font-weight: 700;
    }

    /* ===== Meal Cards ===== */
    .meal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .meal-card__header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
    }

    .meal-card__workplace {
      font-size: 16px;
      font-weight: 800;
    }

    .meal-card__meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .meal-chip {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: #F9FAFB;
    }

    .meal-card__section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }

    /* 메인 메뉴는 빨간 왼쪽 테두리로 강조 */
    .meal-card__primary {
      font-size: 15px;
      font-weight: 800;
      color: var(--danger);
      border-left: 4px solid var(--danger);
      padding-left: 10px;
    }

    .meal-item {
      font-size: 14px;
      line-height: 1.7;
    }

    .meal-list {
      margin: 0;
      padding-left: 18px;
    }

    /* ===== Skeleton Loading ===== */
    .skeleton {
      background: linear-gradient(90deg, #f2f2f2 25%, #eaeaea 37%, #f2f2f2 63%);
      background-size: 400% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
      border-radius: 10px;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    .sk-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: #fff;
      overflow: hidden;
    }

    .sk-h {
      height: 84px;
      border-bottom: 1px solid var(--border);
    }

    .sk-b {
      padding: 14px;
    }

    .sk-line {
      height: 12px;
      margin: 10px 0;
    }

    .sk-line.sm {
      width: 55%;
    }

    .sk-line.md {
      width: 75%;
    }

    .sk-line.lg {
      width: 95%;
    }

    /* ===== Toolbar Layout (Responsive) ===== */

    /* 1) 기본: 왼쪽부터 붙여 배치 */
    .toolbar {
      justify-content: flex-start;
    }

    /* 2) 상태 영역은 오른쪽 끝으로 밀기 */
    .toolbar>.d-flex.gap-2.align-items-center:last-child {
      margin-left: auto;
    }

    /* 3) 큰 화면(PC): 탭을 검색 옆에 붙이고 한 줄 유지 */
    @media (min-width: 992px) {
      .toolbar {
        flex-wrap: nowrap;
      }

      .tabs {
        margin-left: 12px;
      }
    }

    /* 4) 작은 화면(모바일/태블릿): 탭을 아래줄로 내리기 */
    @media (max-width: 991.98px) {
      .tabs {
        width: 100%;
        margin-top: 10px;
        order: 3;
      }
    }

    @media (max-width: 576px) {
      .navbar.m-2 {
        margin: 0 !important;
      }

      .toolbar {
        padding-left: 8px;
        padding-right: 8px;
      }
    }

    /* ===== Language Toggle ===== */
    #btn_lang_kr.active,
    #btn_lang_vn.active {
      border-color: var(--primary);
      background: #EFF6FF;
    }

    .lang-flag {
      height: 22px;
      width: auto;
    }

    @media (max-width: 480px) {
      .lang-flag {
        height: 20px;
      }

      #btn_lang_kr,
      #btn_lang_vn {
        padding: 0px 0px;
      }
    }

    /* ===== Weekly Menu Modal Table ===== */
    .weekly-table th {
      text-align: center;
      vertical-align: middle;
      background: #F3F4F6;
      font-size: 13px;
      white-space: nowrap;
    }

    .weekly-table .cat-cell {
      text-align: center;
      vertical-align: middle;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      background: #F9FAFB;
    }

    .weekly-table .menu-cell {
      vertical-align: top;
      font-size: 13px;
      min-width: 110px;
    }

    .weekly-menu-items {
      margin: 0;
      padding-left: 16px;
      line-height: 1.8;
    }

    .weekly-table .today-col {
      background: #EFF6FF;
    }

    .weekly-table .today-col th {
      background: #DBEAFE;
      color: var(--primary);
    }
  </style>

</head>

<body>

  <div class="header-sticky">
    <header class="navbar navbar-expand-lg navbar-bordered bg-white m-2">
      <div class="container-fluid">
        <!-- 언어 상태에 따라 JS로 src 교체 (updateLogo) -->

    <!-- Toast 알림 컨테이너 (Bootstrap Toast, JS로 동적 생성) -->

    <main class="main">

      <!-- ===== Toolbar: 날짜 선택 / 카테고리 탭 / 언어 전환 ===== -->
      <div class="">
        <div class="toolbar">

          <!-- 날짜 입력 + 이전/다음/검색 버튼 -->

          <div class="tabs" role="tablist" aria-label="메뉴 카테고리">

            <button type="button" class="tab-btn js-category" data-category="2" id="tab_sang"></button>   <!-- 조식 -->
            <button type="button" class="tab-btn js-category" data-category="3" id="tab_trua"></button>   <!-- 중식 -->

      <!-- ===== Main Content ===== -->

        <!-- 메뉴 카드 목록 (JS에서 cardTemplate 복제 후 주입) -->
        <div class="row" id="menu-card-container"></div>

        <!-- 조회 결과 없음 상태 (데이터 없을 때 표시) -->

      <!-- ===== Card Template (DOM clone 방식: innerHTML보다 빠름) ===== -->
      <template id="cardTemplate">

                  <div class="meal-card__meta">
                    <span class="meal-chip js-applydate"></span>
                    <span class="meal-chip js-category"></span>
                    <button class="btn btn-outline-primary btn-sm ms-1 js-week-download" type="button" title="주간 식단 보기">

      <!-- ===== Skeleton Template (데이터 로딩 중 플레이스홀더) ===== -->
      <template id="skeletonTemplate">
        <div class="col-12 col-xl-2 col-lg-4 col-md-6 col-sm-12 mb-3 g-2">
          <div class="sk-card">
            <div class="sk-h skeleton"></div>
            <div class="sk-b">
              <div class="sk-line lg skeleton"></div>
              <div class="sk-line md skeleton"></div>
              <div class="sk-line sm skeleton"></div>

  <!-- ===== Vendor Scripts ===== -->
  <script src="assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/moment/min/moment.min.js"></script>
  <script src="assets/vendor/moment/min/locale/ko.min.js"></script>

  <script>
    // ============================================================
    // Architecture:
    //   - 카드 렌더링만 사용 (bootstrap-table 미사용)
    //   - <template> DOM 복제 + DocumentFragment로 reflow 최소화
    //   - 캐시: Map(key → {ts, data}), TTL 2분 + SWR 패턴
    //   - AbortController로 빠른 연속 요청 시 이전 요청 취소
    // ============================================================


    // ===== Constants =====
    const API_BASE = 'https://pvbi.ddns.net/api/korean-menu';
    const API_KEY = 'l0vLjDuIxAAUjHd7';


    // ===== App State =====
    const formState = {
      lang: 'kr',
      searchDate: '',
      searchSite: '0',
      searchCategory: '0'
    };


    // ===== I18N (한국어 / 베트남어) =====
    const I18N = {
      kr: {
        TITLE_MAIN: '메인 메뉴',
        TITLE_MENU: '메뉴',
        ALL: '전체',
        BREAKFAST: '조식',
        LUNCH: '중식',
        DINNER: '석식',
        NIGHT: '야식',
        EMPTY_TITLE: '조회 결과 없음',
        EMPTY_DESC: '선택한 조건에 해당하는 식단이 없습니다.',
        NO_MENU: '등록된 메뉴가 없습니다.',
        FOOTER_NOTICE: '식자재 수급 상황에 따라서 메뉴는 바뀔 수 있습니다.'
      },
      vn: {
        TITLE_MAIN: 'Món chính',
        TITLE_MENU: 'Thực đơn',
        ALL: 'Tất cả',
        BREAKFAST: 'sáng',
        LUNCH: 'trưa',
        DINNER: 'tối',
        NIGHT: 'đêm',
        EMPTY_TITLE: 'Không có dữ liệu',
        EMPTY_DESC: 'Không có thực đơn cho điều kiện đã chọn.',
        NO_MENU: 'Không có món ăn',
        FOOTER_NOTICE: 'Thực đơn có thể thay đổi tùy theo tình hình cung ứng nguyên liệu.'
      }
    };


    // ===== Utilities =====

    function getQueryParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }

    function setStatus(text) {
      const el = document.getElementById('status_text');
      if (el) el.textContent = text || '';
    }


    // ===== Toast (Bootstrap) =====

    function toast(message) {
      const container = document.querySelector('.toast-container');
      if (!container) return;

      const toastEl = document.createElement('div');
      toastEl.className = 'toast border border-primary';
      toastEl.role = 'alert';
      toastEl.ariaLive = 'assertive';
      toastEl.ariaAtomic = 'true';
      toastEl.setAttribute('data-bs-delay', '2500');

      toastEl.innerHTML = `
        <div class="toast-header">
          <strong class="me-auto text-black">Message</strong>
          <small>Just now</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body"><p class="text-black mb-0"></p></div>
      `;

      toastEl.querySelector('.toast-body p').textContent = message;
      container.appendChild(toastEl);

      const t = new bootstrap.Toast(toastEl);
      t.show();

      setTimeout(() => toastEl.remove(), 3500);
    }


    // ===== Cache (TTL + SWR) =====
    // 같은 조건으로 재조회 시 캐시를 먼저 보여주고 백그라운드에서 갱신
    const menuCache = new Map(); // key → {ts, data}
    const CACHE_TTL_MS = 2 * 60 * 1000; // 2분

    function cacheKey(date, site, category, lang) {
      return `${date}|${site}|${category}|${lang}`;
    }

    function cacheGet(key) {
      const v = menuCache.get(key);
      if (!v) return null;
      if ((Date.now() - v.ts) > CACHE_TTL_MS) return null; // TTL 만료
      return v.data;
    }

    function cacheSet(key, data) {
      menuCache.set(key, { ts: Date.now(), data });
    }


    // ===== API Fetch (AbortController + 중복 요청 제거) =====
    // 동일한 키로 동시에 여러 요청이 오면 하나만 실제 fetch하고 나머지는 같은 Promise를 공유
    let currentAbort = null;
    const inflight = new Map(); // key → Promise

    async function fetchMenu({ date, site, category, lang }, { signal } = {}) {
      const url = new URL(API_BASE);
      url.searchParams.set('date', date);
      url.searchParams.set('siteId', site);
      url.searchParams.set('categoryId', category);

      const key = cacheKey(date, site, category, lang);
      if (inflight.has(key)) return inflight.get(key);

      const p = (async () => {
        const res = await fetch(url.toString(), {
          method: 'GET',
          headers: { 'X-API-KEY': API_KEY },
          signal
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })();

      inflight.set(key, p);

      try {
        const data = await p;
        return data;
      } finally {
        inflight.delete(key);
      }
    }


    // ===== Rendering =====

    function showEmptyState(show) {
      document.getElementById('menu-empty-state').style.display = show ? '' : 'none';
      document.getElementById('menu-card-container').style.display = show ? 'none' : '';
    }

    function renderSkeleton(count = 10) {
      const container = document.getElementById('menu-card-container');
      const tpl = document.getElementById('skeletonTemplate');
      const frag = document.createDocumentFragment();
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        frag.appendChild(tpl.content.cloneNode(true));
      }
      container.appendChild(frag);
    }

    // API 응답 형태가 배열/rows/data 등으로 올 수 있어 정규화
    function normalizeRows(res) {
      if (Array.isArray(res)) return res;
      if (res && Array.isArray(res.rows)) return res.rows;
      if (res && Array.isArray(res.data)) return res.data;
      return [];
    }

    function formatDisplayDate(applyDate) {
      const m = moment(applyDate, 'YYYY-MM-DD');
      const dow = (formState.lang === 'kr') ? m.locale('ko').format('ddd') : m.locale('vi').format('ddd');
      return m.format('MM/DD') + ' (' + dow + ')';
    }

    // 언어에 따라 menu_name_k_N 또는 menu_name_v_N 필드 선택
    function menuValue(row, idx) {
      const isVn = formState.lang === 'vn';
      const k = isVn ? `menu_name_v_${idx}` : `menu_name_k_${idx}`;
      return (row && row[k]) ? String(row[k]).trim() : '';
    }

    function categoryLabel(row) {
      return (formState.lang === 'vn') ? (row.category_name_v || '') : (row.category_name_k || '');
    }

    function renderCards(rows) {
      const container = document.getElementById('menu-card-container');
      const tpl = document.getElementById('cardTemplate');

      container.innerHTML = '';
      const frag = document.createDocumentFragment();

      for (const row of rows) {
        const node = tpl.content.cloneNode(true);

        node.querySelector('.js-workplace').textContent = row.workplace_name || '';
        node.querySelector('.js-applydate').textContent = formatDisplayDate(row.apply_date);
        node.querySelector('.js-category').textContent = categoryLabel(row);
        node.querySelector('.js-title-main').textContent = I18N[formState.lang].TITLE_MAIN;
        node.querySelector('.js-title-menu').textContent = I18N[formState.lang].TITLE_MENU;

        // idx 3 = 메인 메뉴, 1·2·4~7 = 부메뉴
        const main = menuValue(row, 3);
        node.querySelector('.js-main-menu').textContent = main || '';

        const list = node.querySelector('.js-menu-list');
        const menus = [1, 2, 4, 5, 6, 7].map(i => menuValue(row, i)).filter(v => v);

        if (menus.length === 0) {
          const li = document.createElement('li');
          li.className = 'meal-item text-muted';
          li.textContent = I18N[formState.lang].NO_MENU;
          list.appendChild(li);
        } else {
          for (const m of menus) {
            const li = document.createElement('li');
            li.className = 'meal-item';
            li.textContent = m;
            list.appendChild(li);
          }
        }

        // 주간 식단 버튼에 사업장·날짜 정보를 data 속성으로 저장 (클릭 핸들러에서 읽음)
        const btn = node.querySelector('.js-week-download');
        btn.dataset.site = row.site_url || '';
        btn.dataset.date = row.apply_date || '';
        btn.dataset.siteName = row.workplace_name || '';

        frag.appendChild(node);
      }

      container.appendChild(frag);
    }


    // ===== UI State =====

    function applyI18N() {
      document.getElementById('tab_all').textContent    = I18N[formState.lang].ALL;
      document.getElementById('tab_sang').textContent   = I18N[formState.lang].BREAKFAST;
      document.getElementById('tab_trua').textContent   = I18N[formState.lang].LUNCH;
      document.getElementById('tab_chieu').textContent  = I18N[formState.lang].DINNER;
      document.getElementById('tab_dem').textContent    = I18N[formState.lang].NIGHT;
      document.getElementById('empty_title').textContent  = I18N[formState.lang].EMPTY_TITLE;
      document.getElementById('empty_desc').textContent   = I18N[formState.lang].EMPTY_DESC;
      document.getElementById('footer_notice').textContent = I18N[formState.lang].FOOTER_NOTICE;

      updateLogo();
    }

    function setActiveCategoryButton(categoryValue) {
      const buttons = document.querySelectorAll('.js-category');
      buttons.forEach(b => b.classList.toggle('active', String(b.dataset.category) === String(categoryValue)));
    }


    // ===== Category 자동 선택 (시간 기반) =====
    // 사용자가 수동으로 탭을 누른 경우엔 자동 선택을 덮어쓰지 않음
    let manualCategoryOverride = false;
    let lastAutoSelectDate = moment().format('YYYY-MM-DD');

    function getCategoryByNow(now = moment()) {
      const h = now.hour();
      if (h >= 5  && h <= 9)  return '2'; // 조식
      if (h >= 10 && h <= 14) return '3'; // 중식
      if (h >= 15 && h <= 19) return '4'; // 석식
      return '5';                          // 야식
    }

    function autoSelectCategoryByTime() {
      const today = moment().format('YYYY-MM-DD');
      // 날짜가 바뀌면 수동 선택 플래그 초기화
      if (lastAutoSelectDate !== today) {
        manualCategoryOverride = false;
        lastAutoSelectDate = today;
      }
      if (manualCategoryOverride) return;
      const cat = getCategoryByNow();
      formState.searchCategory = cat;
      setActiveCategoryButton(cat);
    }


    // ===== Reload (SWR: 캐시 즉시 표시 → 백그라운드 갱신) =====
    async function reload({ revalidate = true } = {}) {
      const date     = document.getElementById('start_date').value || moment().format('YYYY-MM-DD');
      const site     = formState.searchSite;
      const category = formState.searchCategory;
      const lang     = formState.lang;

      const key = cacheKey(date, site, category, lang);

      // 1) 캐시가 있으면 즉시 렌더링 (사용자 체감 속도 향상)
      const cached = cacheGet(key);
      if (cached) {
        const rows = normalizeRows(cached);
        if (rows.length === 0) {
          showEmptyState(true);
        } else {
          showEmptyState(false);
          renderCards(rows);
        }
        if (!revalidate) return;
        // revalidate = true이면 캐시 표시 후 백그라운드에서 최신 데이터 fetch
      } else {
        showEmptyState(false);
        renderSkeleton(10);
      }

      // 2) 이전 진행 중인 요청 취소 (빠른 날짜 변경 시 race condition 방지)
      if (currentAbort) currentAbort.abort();
      currentAbort = new AbortController();

      try {
        const res = await fetchMenu({ date, site, category, lang }, { signal: currentAbort.signal });
        cacheSet(key, res);

        const rows = normalizeRows(res);
        if (rows.length === 0) {
          showEmptyState(true);
        } else {
          showEmptyState(false);
          // 저사양 기기 대응: idle 시점에 DOM 작업 수행
          const doRender = () => renderCards(rows);
          if ('requestIdleCallback' in window) requestIdleCallback(doRender, { timeout: 300 });
          else setTimeout(doRender, 0);
        }
        setStatus('');
      } catch (e) {
        if (e && e.name === 'AbortError') return; // 의도적 취소, 정상
        showEmptyState(true);
        setStatus('');
        toast('데이터 조회에 실패했습니다. 네트워크 상태를 확인해주세요.');
      }
    }


    // ===== Weekly Menu Modal =====
    // 카테고리 표시 순서 고정 (조식→중식→석식→야식)
    const CATEGORY_ORDER = { '조식': 0, 'sáng': 0, '중식': 1, 'trưa': 1, '석식': 2, 'tối': 2, '야식': 3, 'đêm': 3 };
    const DOW_KR = ['월', '화', '수', '목', '금', '토', '일'];
    const DOW_VN = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];

    function renderWeeklyTable(rows) {
      const isVn  = formState.lang === 'vn';
      const today = moment().format('YYYY-MM-DD');

      const dates      = [...new Set(rows.map(r => r.apply_date))].sort();
      const catKey     = isVn ? 'category_name_v' : 'category_name_k';
      const categories = [...new Set(rows.map(r => r[catKey] || ''))].filter(Boolean)
        .sort((a, b) => (CATEGORY_ORDER[a] ?? 99) - (CATEGORY_ORDER[b] ?? 99));

      // (날짜|카테고리) → row 로 O(1) 조회
      const lookup = new Map();
      for (const r of rows) {
        lookup.set(`${r.apply_date}|${r[catKey]}`, r);
      }

      const DOW = isVn ? DOW_VN : DOW_KR;

      let html = '<div class="table-responsive"><table class="table table-bordered table-sm weekly-table mb-2">';

      // 헤더: 날짜별 열
      html += '<thead><tr><th style="min-width:52px"></th>';
      for (const d of dates) {
        const dm     = moment(d, 'YYYY-MM-DD');
        const dow    = DOW[dm.isoWeekday() - 1];
        const isToday = d === today;
        html += `<th class="${isToday ? 'today-col' : ''}">${dow}<br><small class="fw-normal">${dm.format('MM/DD')}</small></th>`;
      }
      html += '</tr></thead>';

      // 바디: 카테고리별 행
      html += '<tbody>';
      for (const cat of categories) {
        html += `<tr><td class="cat-cell">${cat}</td>`;
        for (const d of dates) {
          const isToday = d === today;
          const row     = lookup.get(`${d}|${cat}`);
          html += `<td class="menu-cell${isToday ? ' today-col' : ''}">`;
          if (row) {
            const items = [1, 2, 3, 4, 5, 6, 7]
              .map(i => isVn ? row[`menu_name_v_${i}`] : row[`menu_name_k_${i}`])
              .filter(v => v && String(v).trim());
            html += items.length
              ? '<ul class="weekly-menu-items">' + items.map(m => `<li>${m}</li>`).join('') + '</ul>'
              : '<span class="text-muted">-</span>';
          } else {
            html += '<span class="text-muted">-</span>';
          }
          html += '</td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      html += `<p class="text-muted small mb-0">${I18N[formState.lang].FOOTER_NOTICE}</p>`;

      document.getElementById('weekly-modal-body').innerHTML = html;
    }

    // 주간 식단 버튼 클릭 → 모달 열기 + 데이터 fetch
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('.js-week-download');
      if (!btn) return;

      const site     = btn.dataset.site;
      const date     = btn.dataset.date;
      const siteName = btn.dataset.siteName || '';

      if (!site || !date) {
        toast('사업장 또는 날짜 정보가 없습니다.');
        return;
      }

      const m    = moment(date, 'YYYY-MM-DD');
      const year = m.isoWeekYear();
      const week = String(m.isoWeek()).padStart(2, '0');

      document.getElementById('weeklyMenuModalLabel').textContent =
        `${siteName} — ${year}년 ${week}주차 식단`;

      // 로딩 스피너 표시 후 모달 오픈
      document.getElementById('weekly-modal-body').innerHTML =
        '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2 text-muted small">불러오는 중...</div></div>';

      const modalEl = document.getElementById('weeklyMenuModal');
      const modal   = bootstrap.Modal.getOrCreateInstance(modalEl);
      modalEl.addEventListener('shown.bs.modal', () => {
        modalEl.querySelector('.btn-close').focus();
      }, { once: true });
      modal.show();

      const url = `https://pvbi.ddns.net/api/korean_menu/weekly-menu/data/${year}/${site}/${week}?t=${Date.now()}`;

      fetch(url, { headers: { 'X-API-KEY': API_KEY } })
        .then(r => r.json())
        .then(res => {
          const rows = normalizeRows(res);
          if (!rows.length) {
            document.getElementById('weekly-modal-body').innerHTML =
              '<div class="text-center py-4 text-muted">등록된 주간 식단이 없습니다.</div>';
            return;
          }
          renderWeeklyTable(rows);
        })
        .catch(() => {
          document.getElementById('weekly-modal-body').innerHTML =
            '<div class="text-center py-4 text-danger">데이터를 불러오지 못했습니다.</div>';
        });
    });


    // ===== Event Wiring =====

    function addDaysToInputDate(deltaDays) {
      const input   = document.getElementById('start_date');
      const current = input.value ? moment(input.value, 'YYYY-MM-DD') : moment();
      input.value   = current.add(deltaDays, 'days').format('YYYY-MM-DD');
    }

    document.getElementById('bt_date_subtract').addEventListener('click', () => { addDaysToInputDate(-1); reload(); });
    document.getElementById('bt_date_add').addEventListener('click',      () => { addDaysToInputDate(1);  reload(); });
    document.getElementById('bt_search').addEventListener('click',        () => reload({ revalidate: true }));
    document.getElementById('start_date').addEventListener('change',      () => reload({ revalidate: true }));

    document.querySelectorAll('.js-category').forEach(btn => {
      btn.addEventListener('click', () => {
        manualCategoryOverride = true;
        formState.searchCategory = String(btn.dataset.category);
        setActiveCategoryButton(formState.searchCategory);
        reload();
      });
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });
    });

    // 언어 전환
    document.getElementById('btn_lang_kr').addEventListener('click', () => {
      formState.lang = 'kr';
      applyI18N();
      reload({ revalidate: true });
    });

    document.getElementById('btn_lang_vn').addEventListener('click', () => {
      formState.lang = 'vn';
      applyI18N();
      reload({ revalidate: true });
    });


    // ===== Logo =====

    function updateLogo() {
      const logo = document.getElementById('main_logo');
      if (!logo) return;
      logo.src = (formState.lang === 'vn')
        ? 'assets/svg/logos/main_logo_vn.png'
        : 'assets/svg/logos/main_logo_kr.png';
    }


    // ===== Init =====
    (function init() {
      // URL 파라미터로 초기 언어·사업장·날짜 설정
      const urlLang = getQueryParam('lang');
      if (urlLang === 'kr' || urlLang === 'vn') formState.lang = urlLang;

      const siteParam = getQueryParam('site');
      if (siteParam) formState.searchSite = String(siteParam);

      const dateParam = getQueryParam('date');
      const input = document.getElementById('start_date');
      input.value = dateParam ? String(dateParam) : moment().format('YYYY-MM-DD');

      applyI18N();
      autoSelectCategoryByTime();
      setActiveCategoryButton(formState.searchCategory);

      // 5분마다 시간 기반 카테고리 재확인 (자정 넘김 대응)
      setInterval(() => {
        autoSelectCategoryByTime();
        setActiveCategoryButton(formState.searchCategory);
      }, 5 * 60 * 1000);

      reload({ revalidate: true });
    })();

  </script>

</body>
